# Health triage end-to-end test: overlay on top of compose/docker-compose.yml (and, on the AWS
# testbed, compose.testbed-gateway.yml). Use it through e2e.sh, which renders the config and
# exports the E2E_* variables below; see README.md in this directory.
#
#   caliban                       runs with the rendered config (the stack's own config plus the
#                                 e2e [routing] table; the tenant's intents come from the admin API)
#   caliban-e2e-mongo             MongoDB 8.0 replica set rs0, primary
#   caliban-e2e-mongo-analytics   secondary, tag workload=analytics: Caliban's native lane reads
#                                 from a tagged secondary, never from the primary
#   caliban-e2e-model             the scripted model (no GPU) or, with E2E_MODEL_UPSTREAM_URL, a
#                                 recorder in front of the real model; logs what the model receives
#
# The MongoDB members and the model sit on the internal `backend` network, like the stack's other
# servers. The model also joins caliban-e2e-out, a plain bridge, only so that the recorder can reach
# a model server on another host (the testbed's GPU host); the scripted model makes no calls.
# Paths are absolute (E2E_DIR, E2E_WORK_DIR): compose resolves relative paths against the first
# file's directory (compose/), not this one.

x-e2e-mongo: &e2e-mongo
  image: ${E2E_MONGO_IMAGE:-mongo:8.0.32}
  user: "999:999"
  # A replica set with auth needs a key file shared by its members; it comes from the environment
  # (generated by e2e.sh into the work directory) and is written to tmpfs at start.
  entrypoint:
    - bash
    - -c
    - printf '%s' "$$E2E_MONGO_KEYFILE" > /tmp/keyfile && chmod 400 /tmp/keyfile && exec mongod --replSet rs0 --bind_ip_all --keyFile /tmp/keyfile --auth
  environment:
    E2E_MONGO_KEYFILE: ${E2E_MONGO_KEYFILE:?run e2e.sh up}
  tmpfs:
    - /tmp
  networks: [backend]
  security_opt:
    - no-new-privileges:true
  healthcheck:
    test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand({ ping: 1 }).ok"]
    interval: 5s
    timeout: 5s
    retries: 30
    start_period: 10s

services:
  caliban:
    environment:
      # Node runs of a real model think before they answer: wait longer before a sync request
      # gives up (the run carries on either way; the run script follows it).
      CALIBAN_NODE_SYNC_WAIT_SECS: ${E2E_NODE_SYNC_WAIT_SECS:-180}
    volumes:
      - ${E2E_CALIBAN_TOML:?run e2e.sh up}:/etc/caliban/caliban.toml:ro

  caliban-e2e-mongo:
    <<: *e2e-mongo
    container_name: caliban-e2e-mongo
    volumes:
      - caliban-e2e-mongo-data:/data/db
      - ${E2E_DIR:?run e2e.sh up}/seed:/e2e/seed:ro

  caliban-e2e-mongo-analytics:
    <<: *e2e-mongo
    container_name: caliban-e2e-mongo-analytics
    volumes:
      - caliban-e2e-mongo-analytics-data:/data/db

  caliban-e2e-model:
    image: ${E2E_PYTHON_IMAGE:-python:3.11-slim}
    container_name: caliban-e2e-model
    user: "${E2E_UID:-1000}:${E2E_GID:-1000}"
    command: ["python3", "-u", "/e2e/mock/model.py"]
    read_only: true
    environment:
      MOCK_LOG: /log/requests.jsonl
      MOCK_UPSTREAM_URL: ${E2E_MODEL_UPSTREAM_URL:-}
      MOCK_EMBED_UPSTREAM_URL: ${E2E_EMBED_UPSTREAM_URL:-}
      MOCK_FOLLOW_INJECTIONS: ${E2E_FOLLOW_INJECTIONS:-0}
      PYTHONDONTWRITEBYTECODE: "1"
    volumes:
      - ${E2E_DIR:?run e2e.sh up}/mock:/e2e/mock:ro
      - ${E2E_WORK_DIR:?run e2e.sh up}/model-log:/log
    networks: [backend, caliban-e2e-out]
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).status == 200 else 1)"]
      interval: 5s
      timeout: 5s
      retries: 20

networks:
  caliban-e2e-out:
    name: caliban-e2e-out
    driver: bridge

volumes:
  caliban-e2e-mongo-data:
    name: caliban-e2e-mongo-data
  caliban-e2e-mongo-analytics-data:
    name: caliban-e2e-mongo-analytics-data
