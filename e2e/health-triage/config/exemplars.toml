# Tenant exemplars for caliban/auto: the `triage` intent of the e2e tenant (medmarket), in English,
# French and Arabic. e2e.sh appends this table (after a [routing] table it renders) to the
# Caliban config the e2e stack runs with. Core reads tenant exemplars from the config file only;
# the intent-to-node mapping (`triage` -> node/triage@published) is set through the admin API.
# Synthetic utterances: no names, no identifiers.

