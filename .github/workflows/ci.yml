name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  helm:
    name: Helm lint and template
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
        with:
          version: v3.22.0
      - run: helm lint --strict helm/caliban
      - run: helm lint --strict helm/caliban -f helm/caliban/values-airgap.yaml
      - run: helm template caliban helm/caliban > /dev/null
      - run: helm template caliban helm/caliban --set router.mode=static > /dev/null
      - run: helm template caliban helm/caliban -f helm/caliban/values-airgap.yaml > /dev/null
      - name: Single sign-on renders into caliban.toml, the env and the NetworkPolicy
        run: |
          cat > /tmp/sso.yaml <<'EOF'
          sso:
            enabled: true
            issuer: https://keycloak.example.internal/realms/caliban
            clientId: caliban-console
            redirectUrl: https://caliban.example.internal/auth/callback
            apiAudience: caliban-api
            sessionIdleSeconds: 1800
            breakGlass: false
            roleMappings:
              - { group: caliban-owners, role: owner }
              - { group: acme-developers, role: developer, tenant: acme }
          networkPolicy:
            egress:
              identityProvider:
                - to: [{ ipBlock: { cidr: 10.20.0.15/32 } }]
                  ports: [{ port: 443, protocol: TCP }]
          EOF
          helm lint --strict helm/caliban -f /tmp/sso.yaml
          for extra in "" "--set mode=standalone"; do
            out=$(helm template caliban helm/caliban -f /tmp/sso.yaml $extra)
            for want in '[security.oidc]' '[[security.oidc.role_mappings]]' 'tenant = "acme"' \
                'client_secret = { env = "CALIBAN_OIDC_CLIENT_SECRET" }' 'break_glass = false' \
                'session_idle_secs = 1800' 'name: CALIBAN_OIDC_CLIENT_SECRET' \
                'key: oidc-client-secret' 'egress-identity-provider'; do
              grep -qF -- "$want" <<<"$out" || { echo "::error::missing '$want' ($extra)"; exit 1; }
            done
          done
      - name: Single sign-on settings core would refuse fail at render time
        run: |
          base=(--set sso.enabled=true --set sso.issuer=https://i --set sso.clientId=c
                --set sso.redirectUrl=https://c/auth/callback)
          refused() {
            if helm template caliban helm/caliban "$@" > /dev/null 2>&1; then
              echo "::error::helm template should have failed: $*"; exit 1
            fi
          }
          refused --set sso.breakGlass=false                         # nobody could sign in
          refused --set sso.enabled=true                             # no issuer, client id, redirect URL
          refused "${base[@]}" --set 'sso.roleMappings[0].group=g' \
            --set 'sso.roleMappings[0].role=developer'               # tenant role without a tenant
          refused "${base[@]}" --set 'sso.roleMappings[0].group=g' \
            --set 'sso.roleMappings[0].role=owner' --set 'sso.roleMappings[0].tenant=acme'
          refused "${base[@]}" --set 'sso.roleMappings[0].group=g' --set 'sso.roleMappings[0].role=root'
          refused "${base[@]}" --set config.security.oidc.issuer=https://i   # configured twice
          # A base that renders, so the failures above are the checks, not the base.
          helm template caliban helm/caliban "${base[@]}" > /dev/null
      - name: Model pools wait for embed and rerank (waitFor), skipping disabled pools
        run: |
          cat > /tmp/pools.yaml <<'EOF'
          modelPools:
            defaults:
              weights: { existingClaim: caliban-models }
            pools:
              - { name: qwen3-large, enabled: true, waitFor: [embed, rerank, gpt-oss], args: [/models/a] }
              - { name: gpt-oss, enabled: false, args: [/models/b] }
              - { name: embed, enabled: true, command: [], args: [--port=8000] }
              - { name: rerank, enabled: true, args: [/models/c] }
          EOF
          helm lint --strict helm/caliban -f /tmp/pools.yaml
          out=$(helm template caliban helm/caliban -f /tmp/pools.yaml)
          for want in 'name: wait-for-pools' '"http://embed:8000/health"' '"http://rerank:8000/health"' \
              'name: caliban-pool-qwen3-large-wait' 'name: caliban-pool-qwen3-large-wait-ingress' \
              'values: [router, worker, standalone]'; do
            grep -qF -- "$want" <<<"$out" || { echo "::error::missing '$want'"; exit 1; }
          done
          if grep -qF 'gpt-oss:8000/health' <<<"$out"; then
            echo "::error::a disabled pool must not be waited for"; exit 1
          fi
          if [ "$(grep -c 'name: wait-for-pools' <<<"$out")" != 1 ]; then
            echo "::error::only qwen3-large should wait"; exit 1
          fi
          for bad in '[embd]' '[qwen3-large]'; do
            sed "s/waitFor: \[embed, rerank, gpt-oss\]/waitFor: $bad/" /tmp/pools.yaml > /tmp/bad.yaml
            if helm template caliban helm/caliban -f /tmp/bad.yaml > /dev/null 2>&1; then
              echo "::error::waitFor $bad should fail the render"; exit 1
            fi
          done
      - name: Routers get a stable id and a usage spool; standalone gets the spool
        run: |
          has() { grep -qF -- "$2" <<<"$1" || { echo "::error::missing '$2' ($3)"; exit 1; }; }
          out=$(helm template caliban helm/caliban)
          has "$out" 'name: CALIBAN_ROUTER_ID' split
          has "$out" 'fieldPath: metadata.name' split
          has "$out" 'value: /var/lib/caliban/usage/spool' split
          has "$out" 'mountPath: /var/lib/caliban/usage' split
          out=$(helm template caliban helm/caliban --set mode=standalone)
          has "$out" 'value: /var/lib/caliban/usage/spool' standalone
          if grep -qF 'CALIBAN_ROUTER_ID' <<<"$out"; then echo "::error::standalone is no router"; exit 1; fi
          # Static routers neither poll nor ship.
          out=$(helm template caliban helm/caliban --set router.mode=static)
          if grep -qE 'CALIBAN_ROUTER_ID|CALIBAN_USAGE_SPOOL_DIR' <<<"$out"; then
            echo "::error::static routers do not ship usage"; exit 1
          fi
          out=$(helm template caliban helm/caliban --set usageSpool.enabled=false)
          if grep -qF 'CALIBAN_USAGE_SPOOL_DIR' <<<"$out"; then echo "::error::usageSpool.enabled=false"; exit 1; fi

      - name: Node workers in split mode only, with their own token, network policies and database
        run: |
          has() { grep -qF -- "$2" <<<"$1" || { echo "::error::missing '$2' ($3)"; exit 1; }; }
          hasnt() { if grep -qF -- "$2" <<<"$1"; then echo "::error::unexpected '$2' ($3)"; exit 1; fi; }
          part() { awk -v f="$2" '$0 ~ "^# Source: caliban/templates/"f {p=1; next} /^---/ {p=0} p' <<<"$1"; }
          out=$(helm template caliban helm/caliban)
          for want in 'name: caliban-worker' 'name: caliban-worker-token' 'name: caliban-ingress-worker' \
              'name: caliban-egress-router-worker'; do
            has "$out" "$want" default
          done
          worker=$(part "$out" deployment-worker.yaml)
          for want in '- worker' 'containerPort: 8082' 'httpGet: { path: /healthz, port: worker }' \
              'name: CALIBAN_DATABASE_URL' 'name: CALIBAN_WORKER_TOKEN' 'name: CALIBAN_WORKER_ID' \
              'fieldPath: metadata.name' 'name: CALIBAN_SNAPSHOT_PUBLIC_KEY' \
              'value: "http://caliban-control-plane:8081"' 'value: /var/lib/caliban/usage/spool' \
              'value: /var/lib/caliban/snapshot.json' 'readOnlyRootFilesystem: true'; do
            has "$worker" "$want" worker
          done
          for not in CALIBAN_ADMIN_TOKEN CALIBAN_SNAPSHOT_SIGNING_KEY CALIBAN_CONFIG CALIBAN_ROUTER_ID; do
            hasnt "$worker" "$not" worker
          done
          router=$(part "$out" deployment-router.yaml)
          has "$router" 'value: "http://caliban-worker:8082"' router
          has "$router" 'name: CALIBAN_WORKER_TOKEN' router
          hasnt "$router" 'CALIBAN_DATABASE_URL' router
          # Standalone runs nodes in-process; static routers have no snapshots; 0 turns them off.
          for extra in mode=standalone router.mode=static worker.replicas=0; do
            out=$(helm template caliban helm/caliban --set "$extra")
            hasnt "$out" 'component: worker' "$extra"
            hasnt "$out" 'CALIBAN_WORKER_' "$extra"
          done
          # A DML-only database role and an existing token Secret; node settings reach every user.
          out=$(helm template caliban helm/caliban --set worker.database.existingSecret=caliban-worker-db \
            --set worker.database.urlKey=uri --set worker.token.existingSecret=caliban-worker \
            --set nodes.syncWaitSeconds=90 --set nodes.leaseSeconds=20 --set nodes.maxRuns=16)
          hasnt "$out" 'kind: Secret' existing-token
          worker=$(part "$out" deployment-worker.yaml)
          has "$worker" 'name: caliban-worker-db' worker-db
          has "$worker" 'key: uri' worker-db
          has "$worker" 'name: caliban-worker' worker-token
          has "$worker" 'name: CALIBAN_NODE_LEASE_SECS' nodes
          has "$(part "$out" deployment-router.yaml)" 'value: "90"' nodes
          hasnt "$(part "$out" deployment-router.yaml)" 'CALIBAN_NODE_LEASE_SECS' nodes
          hasnt "$(part "$out" deployment-control-plane.yaml)" 'CALIBAN_NODE_' nodes
          has "$(helm template caliban helm/caliban --set mode=standalone --set nodes.maxRuns=16)" \
            'name: CALIBAN_NODE_MAX_RUNS' standalone
      - name: Node tools - tool token key, MCP egress, retention and breaker settings
        run: |
          has() { grep -qF -- "$2" <<<"$1" || { echo "::error::missing '$2' ($3)"; exit 1; }; }
          hasnt() { if grep -qF -- "$2" <<<"$1"; then echo "::error::unexpected '$2' ($3)"; exit 1; fi; }
          part() { awk -v f="$2" '$0 ~ "^# Source: caliban/templates/"f {p=1; next} /^---/ {p=0} p' <<<"$1"; }
          out=$(helm template caliban helm/caliban)
          for f in deployment-control-plane.yaml deployment-worker.yaml; do
            d=$(part "$out" "$f")
            has "$d" 'name: CALIBAN_TOOL_TOKEN_KEY' "$f"
            has "$d" 'key: tool-token-key' "$f"
            has "$d" 'key: tool-token-previous-keys' "$f"
          done
          hasnt "$(part "$out" deployment-router.yaml)" 'CALIBAN_TOOL_TOKEN' router
          # The chart never generates the signing key, and nothing is opened to MCP servers by default.
          hasnt "$(part "$out" secret.yaml)" 'tool-token-key' generated
          hasnt "$out" 'egress-mcp' default
          hasnt "$out" 'RETENTION_DAYS' default
          hasnt "$out" 'CALIBAN_MCP_ALLOW_LOOPBACK' default
          cat > /tmp/tools.yaml <<'EOF'
          toolTokens: { existingSecret: caliban-tool-tokens, issuer: caliban-prod }
          nodes: { runRetentionDays: 0, breakerFailures: 7, breakerCooldownSeconds: 60 }
          usageRetentionDays: 120
          networkPolicy:
            egress:
              mcp:
                - to: [{ ipBlock: { cidr: 10.30.0.0/24 } }]
                  ports: [{ port: 443, protocol: TCP }]
          EOF
          helm lint --strict helm/caliban -f /tmp/tools.yaml
          out=$(helm template caliban helm/caliban -f /tmp/tools.yaml)
          mcp=$(part "$out" networkpolicy.yaml)
          has "$mcp" 'name: caliban-egress-mcp' mcp
          has "$mcp" 'values: [control-plane, worker, standalone]' mcp
          has "$mcp" 'cidr: 10.30.0.0/24' mcp
          worker=$(part "$out" deployment-worker.yaml)
          for want in 'name: caliban-tool-tokens' 'value: "caliban-prod"' 'name: CALIBAN_NODE_RUN_RETENTION_DAYS' \
              'value: "0"' 'name: CALIBAN_NODE_BREAKER_FAILURES' 'value: "7"' 'value: "60"'; do
            has "$worker" "$want" worker
          done
          hasnt "$worker" 'CALIBAN_USAGE_RETENTION_DAYS' worker
          has "$(part "$out" deployment-control-plane.yaml)" 'name: CALIBAN_USAGE_RETENTION_DAYS' control-plane
          out=$(helm template caliban helm/caliban -f /tmp/tools.yaml --set mode=standalone)
          for want in CALIBAN_USAGE_RETENTION_DAYS CALIBAN_NODE_RUN_RETENTION_DAYS CALIBAN_TOOL_TOKEN_KEY; do
            has "$out" "name: $want" standalone
          done
          # The development-only loopback switch is refused, globally or per component.
          for v in extraEnv worker.extraEnv controlPlane.extraEnv; do
            if helm template caliban helm/caliban --set "${v}[0].name=CALIBAN_MCP_ALLOW_LOOPBACK" \
                --set "${v}[0].value=true" > /dev/null 2>&1; then
              echo "::error::CALIBAN_MCP_ALLOW_LOOPBACK in $v should fail the render"; exit 1
            fi
          done
      - name: More than one worker needs Valkey (the shared Idempotency-Key store)
        run: |
          helm lint --strict helm/caliban --set worker.replicas=3
          helm template caliban helm/caliban --set worker.replicas=3 > /dev/null
          helm template caliban helm/caliban --set worker.replicas=2 --set valkey.url= \
            --set valkey.existingSecret=caliban-valkey > /dev/null
          for bad in valkey.url= config.limits.store=memory; do
            if helm template caliban helm/caliban --set worker.replicas=2 --set "$bad" > /dev/null 2>&1; then
              echo "::error::worker.replicas=2 with $bad should fail the render"; exit 1
            fi
          done
          # One worker needs no shared store.
          helm template caliban helm/caliban --set config.limits.store=memory > /dev/null
      - name: ServiceMonitor is off by default and scrapes routers and workers
        run: |
          has() { grep -qF -- "$2" <<<"$1" || { echo "::error::missing '$2' ($3)"; exit 1; }; }
          if helm template caliban helm/caliban | grep -qF 'kind: ServiceMonitor'; then
            echo "::error::the ServiceMonitor must be off by default"; exit 1
          fi
          helm lint --strict helm/caliban --set metrics.serviceMonitor.enabled=true
          out=$(helm template caliban helm/caliban --set metrics.serviceMonitor.enabled=true \
            --set metrics.serviceMonitor.labels.release=kube-prometheus)
          for want in 'kind: ServiceMonitor' '- port: http' '- port: worker' 'path: /metrics' \
              'release: kube-prometheus' 'values: [router, worker]'; do
            has "$out" "$want" split
          done
          out=$(helm template caliban helm/caliban --set metrics.serviceMonitor.enabled=true --set mode=standalone)
          has "$out" '- port: http' standalone
          if grep -qF -- '- port: worker' <<<"$out"; then echo "::error::standalone has no worker"; exit 1; fi

  compose:
    name: Compose config
    runs-on: ubuntu-latest
    env:
      # Required values that .env.example leaves blank on purpose. Placeholders, not secrets.
      CALIBAN_ADMIN_TOKEN: ci-placeholder
      CALIBAN_KEK: ci-placeholder
      POSTGRES_PASSWORD: ci-placeholder
      VALKEY_PASSWORD: ci-placeholder
    steps:
      - uses: actions/checkout@v7
      - run: cp compose/.env.example compose/.env
      - name: docker compose config (every profile, with and without the BYOK egress override)
        run: |
          fail=0
          for p in "" qwen3-small qwen3-large qwen3-moe gpt-oss embeddings reranker cpu ollama; do
            prof=()
            if [ -n "$p" ]; then prof=(--profile "$p"); fi
            docker compose -f compose/docker-compose.yml "${prof[@]}" config -q \
              || { echo "::error::compose config failed (profile '$p')"; fail=1; }
            docker compose -f compose/docker-compose.yml -f compose/docker-compose.byok-egress.yml "${prof[@]}" config -q \
              || { echo "::error::compose config with byok-egress failed (profile '$p')"; fail=1; }
          done
          exit "$fail"
      - name: GPU chat pools start after embed and rerank are healthy
        run: |
          cfg=$(docker compose -f compose/docker-compose.yml --profile qwen3-large \
            --profile embeddings --profile reranker config --format json)
          for dep in embed rerank; do
            c=$(jq -r --arg d "$dep" '.services["qwen3-large"].depends_on[$d].condition' <<<"$cfg")
            [ "$c" = service_healthy ] || { echo "::error::qwen3-large must wait for $dep (got $c)"; exit 1; }
            jq -e --arg d "$dep" '.services[$d].healthcheck.test | length > 0' <<<"$cfg" > /dev/null \
              || { echo "::error::$dep needs a healthcheck"; exit 1; }
          done
          # 48 GB defaults (core bench/RESULTS-aws-2026-10b.md).
          for want in --max-model-len=32768 --gpu-memory-utilization=0.82; do
            jq -e --arg w "$want" '.services["qwen3-large"].command | index($w)' <<<"$cfg" > /dev/null \
              || { echo "::error::qwen3-large should default to $want"; exit 1; }
          done
      - name: Standalone keeps its usage spool on a volume and gets numeric node settings
        run: |
          cfg=$(docker compose -f compose/docker-compose.yml config --format json)
          check() { jq -e "$1" <<<"$cfg" > /dev/null || { echo "::error::$2"; exit 1; }; }
          check '.services.caliban.read_only == true' 'caliban must keep a read-only root filesystem'
          check '.services.caliban.environment.CALIBAN_USAGE_SPOOL_DIR == "/var/lib/caliban/usage/spool"' \
            'CALIBAN_USAGE_SPOOL_DIR'
          check '[.services.caliban.volumes[] | select(.type == "volume" and .source == "usage-spool"
            and .target == "/var/lib/caliban/usage")] | length == 1' 'the usage-spool volume'
          # Core rejects empty numbers, so every node setting has a value even without .env.
          for v in CALIBAN_NODE_SYNC_WAIT_SECS CALIBAN_NODE_LEASE_SECS CALIBAN_NODE_POLL_MS CALIBAN_NODE_MAX_RUNS; do
            check ".services.caliban.environment.$v | test(\"^[0-9]+\$\")" "$v must be a number"
          done
          # The image owns the volume's mount point, so the spool is writable without root.
          grep -qF 'COPY --from=core --chown=65532:65532 --chmod=0700 /out/state /var/lib/caliban' \
            images/caliban.Dockerfile || { echo "::error::the image must own /var/lib/caliban"; exit 1; }
      - name: AWS testbed gateway override, with the optional node worker
        env:
          CALIBAN_SNAPSHOT_SIGNING_KEY: ci-placeholder
          CALIBAN_SNAPSHOT_PUBLIC_KEY: ci-placeholder
          CALIBAN_ROUTER_TOKEN: ci-placeholder
          CALIBAN_WORKER_TOKEN: ci-placeholder
          TESTBED_BIND: 10.42.0.10
        run: |
          files=(-f compose/docker-compose.yml -f aws/testbed/bootstrap/compose.testbed-gateway.yml)
          docker compose "${files[@]}" config -q
          cfg=$(docker compose "${files[@]}" --profile worker config --format json)
          jq -e '.services["caliban-worker"].command[0] == "worker"
            and .services["caliban-worker"].read_only == true
            and .services["caliban-worker"].depends_on.caliban.condition == "service_healthy"' <<<"$cfg" > /dev/null \
            || { echo "::error::caliban-worker"; exit 1; }

  shell:
    name: Shellcheck and Dockerfile check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: shellcheck
        run: >-
          docker run --rm -v "$PWD":/mnt -w /mnt koalaman/shellcheck:v0.11.0
          -x images/build.sh airgap/bundle.sh airgap/load.sh scripts/smoke.sh
      # Lints the Dockerfile only; no layers are built, so the core/web siblings are not needed.
      - run: docker buildx build --check -f images/caliban.Dockerfile ..
