  # Harmony tokenizer encodings needed by gpt-oss under vLLM. Without them vLLM tries to
  # download them from openaipublic.blob.core.windows.net at start-up (egress!).
  # Served to vLLM via TIKTOKEN_ENCODINGS_BASE=/models/tiktoken.
  - id: openai/tiktoken-encodings
    source: https://openaipublic.blob.core.windows.net/encodings/{o200k_base,cl100k_base}.tiktoken
    revision: "n/a"
    licence: mit
    dir: tiktoken
    format: tiktoken
    engine: vllm
    profiles: gpt-oss
    bundle: true
    size: 5MB
    sha256: ""

