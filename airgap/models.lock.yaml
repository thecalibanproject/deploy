# Model weights for Caliban's on-prem pools: what `bundle.sh fetch` downloads on a connected
# machine and what `bundle.sh` copies into the signed offline bundle.
# Background and hardware tiers: docs/research/09-open-models-on-prem.md.
#
# Licence policy (docs/architecture/repos-and-conventions.md):
#   Only permissive, redistributable licences in the bundle by default: apache-2.0, mit.
#   bundle.sh (both `fetch` and bundling) refuses anything else unless --allow-licence <id> is
#   passed explicitly, after legal review.
#
# EXCLUDED by default (licences checked on Hugging Face, 2026-10-02):
#   meta-llama/Llama-4-*          Llama 4 Community Licence + AUP: the multimodal models' grant
#                                 excludes EU-domiciled individuals/companies; 700M-MAU clause.
#   google/gemma-3-*, google/embeddinggemma-*   Gemma Terms of Use (custom). Gemma 4 IS apache-2.0.
#   Qwen/Qwen3.8-Flash-Next       "Qwen Community License 1.0": MaaS / AI-work-assistant businesses
#                                 need a separate licence. Qwen/Qwen3.8-2.4T-A95B: "Qwen3.8-Max License".
#   mistralai/Mistral-Medium-3.5-128B, mistralai/Devstral-2-123B-Instruct-2512
#                                 "Modified MIT": no rights if company revenue > US$20M/month.
#   MiniMaxAI/MiniMax-M2.7 (non-commercial), MiniMaxAI/MiniMax-M3, moonshotai/Kimi-K3,
#   zai-org/GLM-5.3 (custom terms), jinaai/jina-embeddings-v5-*, jinaai/jina-reranker-v3 (cc-by-nc-4.0).
#   Candidates for --allow-licence after review: openmdw-1.1 (NVIDIA Nemotron 3.5).
#
# Fields (keep the YAML flat: one key per line, 4-space field indent; bundle.sh parses it with
# awk so neither the connected host nor the site needs YAML tooling):
#   id        upstream model id (and the served model name in compose/config/caliban.toml)
#   source    hf://org/repo | https://... (curl {a,b} globbing allowed) | ollama://tag,tag
#   revision  exact commit to fetch. "TODO-pin-commit" = not pinned yet: `fetch` refuses it
#             unless --allow-unpinned. The `# main@2026-10-02` comment is the HEAD commit seen on
#             that date; copy it into `revision` after your own review.
#   include   optional space-separated globs passed to `hf download --include`
#   exclude   optional space-separated globs passed to `hf download --exclude`
#   licence   SPDX-ish id from the repo's cardData.license; checked by bundle.sh
#   dir       directory under $MODELS_DIR (and under models/ in the bundle)
#   format    informational
#   engine    vllm | tei | llama.cpp | ollama (informational)
#   profiles  comma-separated compose profiles that use it; `k8s` = Helm modelPools only
#   bundle    true = part of the default bundle
#   size      approximate download size (informational)
#   sha256    tree hash of dir (airgap/README.md §2); "" = not yet pinned.
#             `bundle.sh fetch --pin` writes it here; bundling fails on a mismatch.

models:
  # ══════════════ Default bundle: 1×24 GB GPU tier + CPU tier ══════════════

  # Chat, 1×24 GB (compose profile qwen3-small). Served with online FP8.
  - id: Qwen/Qwen3.5-9B
    source: hf://Qwen/Qwen3.5-9B
    revision: "TODO-pin-commit"   # main@2026-10-02: c202236235762e1c871ad0ccb60c8ee5ba337b9a
    licence: apache-2.0
    dir: qwen3.5-9b
    format: safetensors-bf16
    engine: vllm
    profiles: qwen3-small
    bundle: true
    size: 19.3GB
    sha256: ""

  # PII NER (L1) loaded in-process by Caliban itself (not a model server). Prefer fetching with
  # ml/scripts/fetch_pii_ner.py, which writes the hash-verified manifest.json Caliban requires,
  # then copy ml/artifacts/pii_ner/ to the site's CALIBAN_PII_MODEL_DIR (compose: ./models/pii).
  # Licence sign-off pending on the CC-BY-SA fine-tuning text: core/crates/caliban-pii/MODELS.md.
  - id: Wismut/nym-pii-multilingual-small
    source: hf://Wismut/nym-pii-multilingual-small
    revision: "4348999cd3c2e20c49615e9af7c6bbb45b64cd85"
    licence: mit
    include: int8/* tokenizer.json config.json
    dir: pii/nym-pii-multilingual-small-int8
    format: onnx-int8
    engine: caliban
    profiles: core
    bundle: true
    size: 151MB
    sha256: ""

