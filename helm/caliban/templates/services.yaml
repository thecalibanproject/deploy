{{- $routerTarget := ternary "standalone" "router" (eq .Values.mode "standalone") }}
{{- $cpTarget := ternary "standalone" "control-plane" (eq .Values.mode "standalone") }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "caliban.fullname" . }}-router
  labels:
    {{- include "caliban.labels" . | nindent 4 }}
    app.kubernetes.io/component: router
  {{- with .Values.router.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.router.service.type }}
  selector:
    {{- include "caliban.componentLabels" (dict "root" . "component" $routerTarget) | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.router.service.port }}
      targetPort: http
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "caliban.fullname" . }}-control-plane
  labels:
    {{- include "caliban.labels" . | nindent 4 }}
    app.kubernetes.io/component: control-plane
  {{- with .Values.controlPlane.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.controlPlane.service.type }}
  selector:
    {{- include "caliban.componentLabels" (dict "root" . "component" $cpTarget) | nindent 4 }}
  ports:
    - name: admin
      port: {{ .Values.controlPlane.service.port }}
      targetPort: admin
      protocol: TCP
{{- if eq (include "caliban.workersEnabled" .) "true" }}
---
# Node workers: the run API for the routers (CALIBAN_WORKER_URLS), /healthz and /metrics.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "caliban.fullname" . }}-worker
  labels:
    {{- include "caliban.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
  {{- with .Values.worker.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: ClusterIP
  selector:
    {{- include "caliban.componentLabels" (dict "root" . "component" "worker") | nindent 4 }}
  ports:
    - name: worker
      port: {{ .Values.worker.service.port }}
      targetPort: worker
      protocol: TCP
{{- end }}
