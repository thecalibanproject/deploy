{{- if .Values.auth.create }}
{{- /* DEV ONLY. Production: pre-create the Secret and set auth.existingSecret. */}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "caliban.authSecretName" . }}
  labels:
    {{- include "caliban.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{- /* With single sign-on the admin token is only break-glass, so it may be left out. */}}
  {{- if or .Values.auth.adminToken (not .Values.sso.enabled) }}
  {{ .Values.auth.adminTokenKey }}: {{ required "auth.adminToken is required when auth.create=true" .Values.auth.adminToken | b64enc | quote }}
  {{- end }}
  {{ .Values.auth.kekKey }}: {{ required "auth.kek (base64, 32 bytes) is required when auth.create=true" .Values.auth.kek | b64enc | quote }}
  {{- with .Values.auth.kekPrevious }}
  {{ $.Values.auth.kekPreviousKey }}: {{ . | b64enc | quote }}
  {{- end }}
  {{- with .Values.auth.oidcClientSecret }}
  {{ $.Values.auth.oidcClientSecretKey }}: {{ . | b64enc | quote }}
  {{- end }}
{{- end }}
{{- if and .Values.snapshotKeys.create (eq (include "caliban.routerMode" .) "snapshot") }}
---
{{- /* DEV ONLY. Production: pre-create the Secret and set snapshotKeys.existingSecret. */}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "caliban.snapshotSecretName" . }}
  labels:
    {{- include "caliban.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{ .Values.snapshotKeys.signingKeyKey }}: {{ required "snapshotKeys.signingKey is required when snapshotKeys.create=true (caliban gen-signing-key)" .Values.snapshotKeys.signingKey | b64enc | quote }}
  {{ .Values.snapshotKeys.publicKeyKey }}: {{ required "snapshotKeys.publicKey is required when snapshotKeys.create=true (caliban gen-signing-key)" .Values.snapshotKeys.publicKey | b64enc | quote }}
  {{ .Values.snapshotKeys.routerTokenKey }}: {{ required "snapshotKeys.routerToken is required when snapshotKeys.create=true" .Values.snapshotKeys.routerToken | b64enc | quote }}
{{- end }}
{{- if and (eq (include "caliban.workersEnabled" .) "true") (not .Values.worker.token.existingSecret) }}
{{- $name := include "caliban.workerTokenSecretName" . }}
{{- $key := .Values.worker.token.key }}
{{- /* Keep the token of an earlier install or upgrade: routers and workers read it at start,
       so a new value would split running routers from new workers until both roll. */}}
{{- $token := randAlphaNum 64 | b64enc }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- if $existing }}
{{- if and $existing.data (hasKey $existing.data $key) }}
{{- $token = index $existing.data $key }}
{{- end }}
{{- end }}
---
# Router-to-worker token (worker.token.existingSecret is empty). Generated once, then kept.
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "caliban.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{ $key }}: {{ $token | quote }}
{{- end }}
