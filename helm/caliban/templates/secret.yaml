{{- if .Values.auth.create }}
{{- /* DEV ONLY. Production: pre-create the Secret and set auth.existingSecret. */}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "caliban.authSecretName" . }}
  labels:
    {{- include "caliban.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{ .Values.auth.adminTokenKey }}: {{ required "auth.adminToken is required when auth.create=true" .Values.auth.adminToken | b64enc | quote }}
  {{ .Values.auth.kekKey }}: {{ required "auth.kek (base64, 32 bytes) is required when auth.create=true" .Values.auth.kek | b64enc | quote }}
{{- end }}
