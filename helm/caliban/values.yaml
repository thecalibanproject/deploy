# Default values for the Caliban chart.
# Posture: zero egress (NetworkPolicy default-deny), non-root, read-only root FS,
# secrets only via pre-created Secrets (existingSecret pattern).

global:
  # Private registry / mirror for ALL images of this chart, e.g. "registry.internal:5000".
  # Wins over image.registry. The repository path is kept (caliban/caliban).
  imageRegistry: ""
  imagePullSecrets: []
  # - name: regcred

nameOverride: ""
fullnameOverride: ""

# split:      router Deployment (stateless, HPA-ready) + control-plane Deployment. Routers
#             get their config from the control plane's signed snapshots by default
#             (router.mode below), which needs the snapshotKeys Secret.
# standalone: one Deployment running `caliban standalone` (both ports). Small sites.
mode: split

image:
  registry: ""
  repository: caliban/caliban
  # Defaults to .Chart.AppVersion.
  tag: ""
  # sha256:...  When set, the image is referenced by digest (recommended for air-gap).
  digest: ""
  pullPolicy: IfNotPresent

serviceAccount:
  create: true
  name: ""
  annotations: {}
  # Caliban does not talk to the Kubernetes API.
  automountServiceAccountToken: false

# ─────────────── Secrets (existingSecret pattern) ───────────────
# Create them out of band (sealed-secrets, external-secrets, Vault, kubectl):
#   kubectl create secret generic caliban-auth \
#     --from-literal=admin-token="$(openssl rand -hex 32)" \
#     --from-literal=kek="$(openssl rand -base64 32)"
auth:
  existingSecret: caliban-auth
  adminTokenKey: admin-token
  kekKey: kek
  # Optional key in the same Secret with retired KEKs (base64, comma separated), set only during
  # a KEK rotation and read as CALIBAN_KEK_PREVIOUS. See README "KEK rotation".
  kekPreviousKey: kek-previous
  # Key in the same Secret with the single sign-on client secret, read as
  # CALIBAN_OIDC_CLIENT_SECRET by the control plane when sso.enabled (not for a public client):
  #   kubectl create secret generic caliban-auth ... --from-literal=oidc-client-secret='<secret>'
  oidcClientSecretKey: oidc-client-secret
  # DEV ONLY: let the chart create the Secret from the values below.
  # The values end up in the Helm release object; do not use in production.
  create: false
  adminToken: ""
  kek: ""
  kekPrevious: ""
  oidcClientSecret: ""

# ─────────────── Single sign-on (console and admin API) ───────────────
# OpenID Connect against your own identity provider (Keycloak, Entra ID, Okta, ADFS, Authentik,
# Dex, ...), with roles. Provider setup, roles and route permissions: core docs/sso.md.
# Rendered into [security.oidc] of the generated caliban.toml; the client secret comes from the
# auth Secret (auth.oidcClientSecretKey). The control plane must reach the issuer: allow it in
# networkPolicy.egress.identityProvider. Alternatively write config.security.oidc yourself
# (not both).
sso:
  enabled: false
  # Exactly as the provider's discovery document reports it (`iss`), e.g.
  # https://keycloak.example.internal/realms/caliban
  issuer: ""
  clientId: ""
  # The console's callback, as browsers reach it through your ingress, registered at the
  # provider: https://caliban.example.internal/auth/callback. Its origin is the console origin
  # (CSRF checks), and https makes the session cookie Secure.
  redirectUrl: ""
  # true: public client (PKCE only), no client secret.
  publicClient: false
  # Empty = openid, profile, email.
  scopes: []
  # Claim with the user's groups (dotted path for nested claims). Empty = groups.
  groupsClaim: ""
  # Also accept access tokens for this audience on the admin API (CI, scripts). Empty = off.
  apiAudience: ""
  # PEM bundle of extra CA certificates for the provider (internal PKI): a path in the pod,
  # mounted with extraVolumes / extraVolumeMounts.
  caFile: ""
  # Where the provider sends the browser after logout. Empty = the console root.
  postLogoutRedirectUrl: ""
  # Absolute session lifetime and idle timeout. 0 = core defaults (8 h, 1 h).
  sessionTtlSeconds: 0
  sessionIdleSeconds: 0
  # Identity provider groups to roles. Roles: owner, admin, auditor (deployment-wide);
  # tenant_admin, developer, viewer, billing (need a tenant). More can be granted in the
  # console (Users and roles). Map at least your own group to owner for the first sign-in.
  roleMappings: []
  # - { group: caliban-owners, role: owner }
  # - { group: acme-developers, role: developer, tenant: acme }
  # The admin token stays as the break-glass credential (owner rights, every use audited).
  # false refuses it once an owner can sign in with SSO (security.break_glass = false).
  breakGlass: true

# Split mode with router.mode=snapshot: the control plane signs config snapshots with an
# Ed25519 key and routers verify them with the public key. Generate both with the image:
#   eval "$(docker run --rm caliban/caliban:0.1.0 gen-signing-key | sed 's/ *#.*//')"
#   kubectl create secret generic caliban-snapshot \
#     --from-literal=signing-key="$CALIBAN_SNAPSHOT_SIGNING_KEY" \
#     --from-literal=public-key="$CALIBAN_SNAPSHOT_PUBLIC_KEY" \
#     --from-literal=router-token="$(openssl rand -hex 32)"
# The control plane reads signing-key and router-token; routers read public-key and
# router-token (env vars, never the ConfigMap). Not used in standalone or router.mode=static.
snapshotKeys:
  existingSecret: caliban-snapshot
  # Base64 32-byte Ed25519 seed -> CALIBAN_SNAPSHOT_SIGNING_KEY (control plane only).
  signingKeyKey: signing-key
  # Base64 32-byte public key -> CALIBAN_SNAPSHOT_PUBLIC_KEY (routers). A comma-separated
  # list is accepted, so a new key can be trusted before the control plane switches to it.
  publicKeyKey: public-key
  # Bearer token for GET /api/v1/snapshot -> CALIBAN_ROUTER_TOKEN (both sides). It is not
  # the admin token; the snapshot endpoint rejects the admin token.
  routerTokenKey: router-token
  # Optional separate Secret for the routers holding only public-key and router-token. The
  # kubelet fetches whole Secrets, so this keeps the signing key off nodes that run only
  # routers. Empty = routers read existingSecret.
  routerExistingSecret: ""
  # DEV ONLY: let the chart create the Secret from the three values below.
  # The values end up in the Helm release object; do not use in production.
  create: false
  signingKey: ""
  publicKey: ""
  routerToken: ""

# BYOK provider keys referenced from config as api_key = { env = "NAME" }.
# Every key of this Secret becomes an env var of the same name, e.g.
#   kubectl create secret generic caliban-provider-keys --from-literal=ACME_OPENAI_API_KEY=sk-...
# Prefer storing keys through the admin console/API (encrypted with the KEK) instead.
providerKeys:
  existingSecret: ""

# Postgres DSN, from a Secret key (it carries the password).
#   kubectl create secret generic caliban-database \
#     --from-literal=url='postgres://caliban:<pw>@postgres.db.svc:5432/caliban?sslmode=require'
database:
  existingSecret: caliban-database
  urlKey: url

qdrant:
  url: http://qdrant:6333

valkey:
  # Shared quota store (config.limits.store = valkey). Used when existingSecret is empty.
  # Put passwords in a Secret instead: either the whole URL (existingSecret/urlKey), or only the
  # password (passwordSecret/passwordKey, e.g. the official valkey chart's auth secret).
  # rediss://... for TLS.
  url: redis://valkey:6379
  existingSecret: ""
  urlKey: url
  passwordSecret: ""
  passwordKey: password

# tracing filter, e.g. "info,caliban=debug"
log: info

# CALIBAN_TCP_NODELAY on every Caliban pod. Keep it on: on Linux, Nagle plus delayed ACK added
# 24 to 50 ms to the first streamed token (core bench/RESULTS-aws-2026-10.md).
tcpNodelay: true

# Telemetry is OFF unless an endpoint is set. Point it at YOUR collector only.
otel:
  endpoint: ""

# Added to EVERY Caliban pod (router, control plane, standalone). Use the per-component
# router.extraEnv / controlPlane.extraEnv / standalone.extraEnv for anything that must not
# reach the routers.
extraEnv: []
# - name: FOO
#   value: bar
extraEnvFrom: []
extraVolumes: []
extraVolumeMounts: []

# ─────────────── caliban.toml ───────────────
# Rendered to TOML verbatim (maps -> [tables], lists of maps -> [[arrays of tables]],
# { env = "X" } / { file = "X" } -> inline secret references). Same schema as
# core/config/caliban.example.toml. Never put secrets here.
config:
  server:
    router_addr: "0.0.0.0:8080"
    control_plane_addr: "0.0.0.0:8081"
    web_dir: /usr/share/caliban/web
  security:
    egress: deny_by_default
    admin_token:
      env: CALIBAN_ADMIN_TOKEN
  cache:
    exact_enabled: true
    exact_max_entries: 100000
    exact_ttl_secs: 3600
    # T2 semantic cache (Qdrant at CALIBAN_QDRANT_URL). Off unless enabled here AND
    # semantic_cache = "on" on the tenant. threshold, min_threshold and query_prefix are left to
    # core's defaults, calibrated for Qwen3-Embedding-0.6B (the instruction prefix on, both
    # thresholds 0.91: 67% of paraphrases hit with no false hit on near-miss prompts, core
    # bench/RESULTS-aws-2026-10b.md). Set them only for another embedding model, all three
    # together.
    semantic:
      enabled: false
      store: qdrant
      embedding_model: local/qwen3-embedding-0.6b
      max_error_rate: 0.02
      ttl_secs: 86400
      lookup_budget_ms: 50
  pii:
    default_mode: reversible
  # Rate limits and budgets, shared by every router through Valkey (CALIBAN_VALKEY_URL from
  # `valkey` above). While Valkey is unreachable each router limits locally and /healthz shows
  # quota.state = degraded. Limits: core/config/caliban.example.toml.
  limits:
    store: valkey
  # caliban/auto intent routing. Without `routing`, keyword rules pick the intent. To add the
  # embedding kNN stage (needs the embedding pool), uncomment the block. Values calibrated for
  # Qwen3-Embedding-0.6B (kNN top-1 0.948 against 0.838 without the instruction; core
  # bench/RESULTS-aws-2026-10.md). Keep query_prefix DOUBLE-quoted so YAML turns \n into a
  # newline; the chart then writes it to TOML as "\n". oos_threshold only holds with this prefix.
  # routing:
  #   embedding_model: local/qwen3-embedding-0.6b
  #   query_prefix: "Instruct: Given a user request, identify the type of task it asks for\nQuery: "
  #   k: 5
  #   temperature: 0.1
  #   abstain_threshold: 0.6
  #   oos_threshold: 0.64
  # Deployment-wide model servers shared by all tenants (on-prem pools). Hostnames are the
  # Service names of modelPools.pools below (same namespace), or your own engine's Service.
  # cache_salt = true only for vLLM / SGLang (per-tenant prefix-cache isolation).
  # Catalogue background: core/config/open-models.example.toml, docs/research/09-open-models-on-prem.md.
  providers:
    - id: vllm-qwen3-small
      kind: openai_compatible
      base_url: http://qwen3-small:8000/v1
      trust_tier: t0_sovereign
      cache_salt: true
    - id: vllm-qwen3-large
      kind: openai_compatible
      base_url: http://qwen3-large:8000/v1
      trust_tier: t0_sovereign
      cache_salt: true
    - id: tei-embed
      kind: openai_compatible
      base_url: http://embed:8000/v1
      trust_tier: t0_sovereign
      cache_salt: false
    - id: vllm-rerank
      kind: openai_compatible
      base_url: http://rerank:8000/v1
      trust_tier: t0_sovereign
      cache_salt: true
  models:
    - id: local/qwen3.5-9b
      provider: vllm-qwen3-small
      upstream_model: Qwen/Qwen3.5-9B
      kind: chat
      family: qwen3.5
      trust_tier: t0_sovereign
      licence: apache-2.0
      context_window: 131072
      price_in_per_mtok: 0.0
      price_out_per_mtok: 0.0
      capabilities:
        tools: true
        vision: false
        reasoning: hybrid
        reasoning_control: enable_thinking
        inline_think_tags: false
    - id: local/qwen3.8-27b
      provider: vllm-qwen3-large
      upstream_model: Qwen/Qwen3.8-27B-FP8
      kind: chat
      family: qwen3.8
      trust_tier: t0_sovereign
      licence: apache-2.0
      context_window: 131072
      price_in_per_mtok: 0.0
      price_out_per_mtok: 0.0
      capabilities:
        tools: true
        vision: true
        reasoning: hybrid
        reasoning_control: enable_thinking
        inline_think_tags: false
    - id: local/qwen3-embedding-0.6b
      provider: tei-embed
      upstream_model: Qwen/Qwen3-Embedding-0.6B
      kind: embedding
      family: qwen3-embedding
      trust_tier: t0_sovereign
      licence: apache-2.0
      context_window: 32768
      price_in_per_mtok: 0.0
      price_out_per_mtok: 0.0
    - id: local/qwen3-reranker-0.6b
      provider: vllm-rerank
      upstream_model: Qwen/Qwen3-Reranker-0.6B
      kind: rerank
      family: qwen3-reranker
      trust_tier: t0_sovereign
      licence: apache-2.0
      context_window: 8192
      price_in_per_mtok: 0.0
      price_out_per_mtok: 0.0
  tenants:
    - id: default
      name: Default tenant
      pii_mode: reversible
      # SHA-256 hex hashes from `caliban keygen`.
      api_key_hashes: []
      # Tenant-scoped BYOK providers (also add the provider to networkPolicy.egress.providers):
      # providers:
      #   - id: openai
      #     kind: openai
      #     base_url: https://api.openai.com/v1
      #     trust_tier: t2_contracted
      #     api_key:
      #       env: ACME_OPENAI_API_KEY
      routes:
        - intent: default
          models: [local/qwen3.8-27b, local/qwen3.5-9b]
        - intent: chat
          models: [local/qwen3.5-9b, local/qwen3.8-27b]
        - intent: code
          models: [local/qwen3.8-27b, local/qwen3.5-9b]

# ─────────────── Workloads ───────────────
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  privileged: false
  capabilities:
    drop: [ALL]

probes:
  startup:   { periodSeconds: 2,  timeoutSeconds: 2, failureThreshold: 60 }
  liveness:  { periodSeconds: 10, timeoutSeconds: 2, failureThreshold: 3 }
  readiness: { periodSeconds: 5,  timeoutSeconds: 2, failureThreshold: 2 }

router:
  replicas: 2
  args: [router]
  # Where routers get tenants, keys, BYOK credentials, routes and the rest of the config
  # (mode=split only; ignored in standalone):
  #   snapshot  (default) poll the control plane's signed snapshots
  #             (GET /api/v1/snapshot, Ed25519-verified with snapshotKeys). The ConfigMap is
  #             not mounted. Tenants and keys created in the console reach every router
  #             within about one poll interval. Fail-static: if the control plane is down or
  #             a snapshot fails verification, routers keep serving the last good snapshot.
  #   static    read `config` from the ConfigMap (file-driven routers). Console and admin
  #             API changes never reach the routers; keep tenants, keys and routes in
  #             `config`.
  mode: snapshot
  snapshot:
    # Default: the in-release control-plane Service, http://<fullname>-control-plane:<port>.
    controlPlaneUrl: ""
    # CALIBAN_SNAPSHOT_POLL_SECS (core adds +/-20% jitter). Unchanged snapshots cost a 304.
    pollIntervalSeconds: 10
    # Persist the last good signed snapshot in an emptyDir (CALIBAN_SNAPSHOT_CACHE), so a
    # router container that restarts while the control plane is down still serves. A new pod
    # starts with an empty cache and waits for the control plane before it listens.
    cache:
      enabled: true
      sizeLimit: 16Mi
  # Env for router pods only (appended after the global extraEnv).
  extraEnv: []
  resources:
    requests: { cpu: 500m, memory: 512Mi }
    limits:   { memory: 1Gi }
  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: ""
  pdb:
    enabled: true
    minAvailable: 1
  service:
    type: ClusterIP
    port: 8080
    annotations: {}
  podAnnotations: {}
  podLabels: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  topologySpreadConstraints: []
  terminationGracePeriodSeconds: 60

controlPlane:
  replicas: 1
  args: [control-plane]
  # Env for control-plane pods only.
  extraEnv: []
  resources:
    requests: { cpu: 250m, memory: 256Mi }
    limits:   { memory: 512Mi }
  service:
    type: ClusterIP
    port: 8081
    annotations: {}
  podAnnotations: {}
  podLabels: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  topologySpreadConstraints: []
  terminationGracePeriodSeconds: 30

# Used when mode=standalone. Services for router and control plane both point at it.
standalone:
  replicas: 1
  args: [standalone]
  # Env for the standalone pod only.
  extraEnv: []
  resources:
    requests: { cpu: 500m, memory: 512Mi }
    limits:   { memory: 1536Mi }
  podAnnotations: {}
  podLabels: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  topologySpreadConstraints: []
  terminationGracePeriodSeconds: 60

# ─────────────── Model pools (in-cluster inference engines, optional) ───────────────
# One Deployment + Service per ENABLED pool: any OpenAI-compatible engine image (vLLM, SGLang,
# TEI, llama.cpp) serving one model from a read-only weights PVC. The Service is named after
# the pool (no release prefix), matching config.providers[].base_url above.
# Security: pods run non-root under the namespace's restricted PSS, get NO egress at all
# (default-deny NetworkPolicy) and accept traffic only from the Caliban data plane.
# Weights: a PVC laid out like compose's $MODELS_DIR (copy the bundle's models/ dir into it,
# see airgap/README.md). Pools on several nodes need a ReadOnlyMany/ReadWriteMany volume.
# Sizing per hardware tier: docs/research/09-open-models-on-prem.md §4.
modelPools:
  defaults:
    image:
      registry: ""          # global.imageRegistry wins when set
      repository: vllm/vllm-openai
      tag: v0.30.0
      digest: ""
      pullPolicy: IfNotPresent
    command: [vllm, serve]  # set `command: []` on a pool to use the image entrypoint (TEI, llama.cpp)
    port: 8000
    gpus: 1                 # GPU count per pod (0 = CPU pool)
    gpuResourceName: nvidia.com/gpu
    resources:
      requests: { cpu: "4", memory: 32Gi }
      limits: { memory: 64Gi }
    shmSize: 16Gi           # /dev/shm (NCCL / tensor parallel)
    cacheSize: 20Gi         # /cache emptyDir: HF, vLLM, Triton, torch.compile caches
    strategy: Recreate
    terminationGracePeriodSeconds: 60
    healthPath: /health     # vLLM, SGLang, TEI and llama.cpp all expose /health
    weights:
      existingClaim: ""     # PVC with the models/ tree; shared by all pools
      create: false         # or let the chart create one PVC per pool (fill it yourself)
      size: 100Gi
      storageClassName: ""
      accessModes: [ReadWriteOnce]
      mountPath: /models
      subPath: ""
    env:
      - { name: HF_HUB_OFFLINE, value: "1" }
      - { name: TRANSFORMERS_OFFLINE, value: "1" }
      - { name: HF_HUB_DISABLE_TELEMETRY, value: "1" }
      - { name: VLLM_NO_USAGE_STATS, value: "1" }
      - { name: VLLM_DO_NOT_TRACK, value: "1" }
      - { name: DO_NOT_TRACK, value: "1" }
      - { name: HOME, value: /cache }
      - { name: HF_HOME, value: /cache/hf }
      - { name: VLLM_CACHE_ROOT, value: /cache/vllm }
      - { name: TRITON_CACHE_DIR, value: /cache/triton }
      - { name: XDG_CACHE_HOME, value: /cache/xdg }
    nodeSelector: {}
    # Applied to GPU pools only.
    tolerations:
      - { key: nvidia.com/gpu, operator: Exists, effect: NoSchedule }
    affinity: {}
    podAnnotations: {}
    podLabels: {}
    # Non-root, restricted-PSS compatible. If an engine image insists on root, run that pool
    # in a separate namespace/chart with a baseline PSS instead of weakening this one.
    podSecurityContext:
      runAsNonRoot: true
      runAsUser: 1000
      runAsGroup: 1000
      fsGroup: 1000
      seccompProfile: { type: RuntimeDefault }
    securityContext:
      allowPrivilegeEscalation: false
      privileged: false
      capabilities: { drop: [ALL] }
    # How long a pool with waitFor waits for those pools to be ready before it starts anyway.
    waitTimeoutSeconds: 900
    probes:
      # Model load can take many minutes (up to 30 here) on first start.
      startup:   { periodSeconds: 10, timeoutSeconds: 5, failureThreshold: 180 }
      readiness: { periodSeconds: 10, timeoutSeconds: 5, failureThreshold: 3 }
      liveness:  { periodSeconds: 20, timeoutSeconds: 5, failureThreshold: 6 }

  # Per-pool fields: name (required; = Service name), enabled, serviceName, image{}, command,
  # args, port, gpus, gpuResourceName, resources, env (appended to defaults), weights{},
  # replicas, nodeSelector, tolerations, affinity, shmSize, cacheSize, healthPath,
  # podSecurityContext, securityContext, podAnnotations, podLabels, waitFor, waitTimeoutSeconds.
  #
  # waitFor: pools (by name) that must be ready before this pool's engine starts. An init
  # container in the pool's own image (needs python3: vLLM, SGLang) polls their health
  # endpoints, then starts anyway after waitTimeoutSeconds; disabled pools are skipped. The
  # vLLM chat pools wait for embed and rerank: when they share a GPU (time-slicing or MPS),
  # vLLM must take its memory profile after the small models have loaded, or its KV cache comes
  # out too small (core bench/RESULTS-aws-2026-10b.md). On dedicated GPUs it only delays the
  # chat pool's start by the small models' load time; set `waitFor: []` to skip it.
  #
  # One 48 GB GPU shared by qwen3-large, embed and rerank (as compose does) needs the compose
  # budget, measured on an L40S: qwen3-large --gpu-memory-utilization=0.82 and
  # --max-model-len=32768 (context_window 32768 in config.models), rerank 0.10, and TEI about
  # 1.5 GB. The defaults below assume each pool has its own GPU.
  pools:
    # 1×24 GB: Qwen3.5-9B (Apache-2.0), online FP8, text-only, 128k context.
    - name: qwen3-small
      enabled: false
      waitFor: [embed, rerank]
      args:
        - /models/qwen3.5-9b
        - --served-model-name=Qwen/Qwen3.5-9B
        - --host=0.0.0.0
        - --port=8000
        - --language-model-only
        - --quantization=fp8_per_tensor
        - --max-model-len=131072
        - --gpu-memory-utilization=0.80
        - --reasoning-parser=qwen3
        - --enable-auto-tool-choice
        - --tool-call-parser=qwen3_coder
    # 1×48 GB to itself (131072 ctx, fp8 KV) or 1×80 GB (raise to 262144): Qwen3.8-27B-FP8
    # (Apache-2.0). Sharing the 48 GB GPU with embed and rerank: 0.82 and 32768 (see above).
    - name: qwen3-large
      enabled: false
      waitFor: [embed, rerank]
      args:
        - /models/qwen3.8-27b-fp8
        - --served-model-name=Qwen/Qwen3.8-27B-FP8
        - --host=0.0.0.0
        - --port=8000
        - --max-model-len=131072
        - --kv-cache-dtype=fp8
        - --gpu-memory-utilization=0.85
        # vLLM's default max-num-seqs ran out of memory profiling CUDA graphs on a 48 GB L40S
        # (compose, AWS testbed); raise it on 80 GB.
        - --max-num-seqs=32
        - --reasoning-parser=qwen3
        - --enable-auto-tool-choice
        - --tool-call-parser=qwen3_coder
    # Throughput tier: Qwen3.6-35B-A3B-FP8 (MoE, 3B active; Apache-2.0).
    - name: qwen3-moe
      enabled: false
      waitFor: [embed, rerank]
      args:
        - /models/qwen3.6-35b-a3b-fp8
        - --served-model-name=Qwen/Qwen3.6-35B-A3B-FP8
        - --host=0.0.0.0
        - --port=8000
        - --max-model-len=131072
        - --kv-cache-dtype=fp8
        - --gpu-memory-utilization=0.90
        - --reasoning-parser=qwen3
        - --enable-auto-tool-choice
        - --tool-call-parser=qwen3_coder
    # 2×80 GB example with SGLang: Qwen3.5-122B-A10B-FP8, TP2, prefix-heavy agent/RAG traffic.
    - name: qwen3-xl
      enabled: false
      image: { repository: lmsysorg/sglang, tag: v0.5.21 }
      command: [python3, -m, sglang.launch_server]
      gpus: 2
      resources:
        requests: { cpu: "8", memory: 64Gi }
        limits: { memory: 128Gi }
      shmSize: 32Gi
      args:
        - --model-path=/models/qwen3.5-122b-a10b-fp8
        - --served-model-name=Qwen/Qwen3.5-122B-A10B-FP8
        - --host=0.0.0.0
        - --port=8000
        - --tp-size=2
        - --context-length=131072
        - --reasoning-parser=qwen3
        - --tool-call-parser=qwen3_coder
    # gpt-oss-20b (Apache-2.0). Needs the tiktoken encodings next to the weights.
    - name: gpt-oss
      enabled: false
      waitFor: [embed, rerank]
      env:
        - { name: TIKTOKEN_ENCODINGS_BASE, value: /models/tiktoken }
      args:
        - /models/gpt-oss-20b
        - --served-model-name=openai/gpt-oss-20b
        - --host=0.0.0.0
        - --port=8000
        - --max-model-len=131072
        - --enable-auto-tool-choice
        - --tool-call-parser=openai
    # Embeddings: Qwen3-Embedding-0.6B on TEI (GPU image; pick the tag for your GPU arch).
    - name: embed
      enabled: false
      image: { repository: ghcr.io/huggingface/text-embeddings-inference, tag: cuda-1.9.4 }
      command: []
      resources:
        requests: { cpu: "2", memory: 4Gi }
        limits: { memory: 8Gi }
      shmSize: 1Gi
      cacheSize: 2Gi
      args:
        - --model-id=/models/qwen3-embedding-0.6b
        - --served-model-name=Qwen/Qwen3-Embedding-0.6B
        - --hostname=0.0.0.0
        - --port=8000
        - --auto-truncate
    # Reranker: Qwen3-Reranker-0.6B on vLLM's pooling runner (TEI cannot serve it).
    - name: rerank
      enabled: false
      resources:
        requests: { cpu: "2", memory: 8Gi }
        limits: { memory: 16Gi }
      shmSize: 2Gi
      args:
        - /models/qwen3-reranker-0.6b
        - --served-model-name=Qwen/Qwen3-Reranker-0.6B
        - --host=0.0.0.0
        - --port=8000
        - --runner=pooling
        - '--hf-overrides={"architectures":["Qwen3ForSequenceClassification"],"classifier_from_token":["no","yes"],"is_original_qwen3_reranker":true}'
        - --max-model-len=8192
        - --gpu-memory-utilization=0.85
    # CPU-only chat: llama.cpp with the Qwen3.6-35B-A3B Q4_K_M GGUF (~26 GB RAM incl. KV).
    - name: qwen3-cpu
      enabled: false
      image: { repository: ghcr.io/ggml-org/llama.cpp, tag: server-b11347 }
      command: []
      gpus: 0
      resources:
        requests: { cpu: "16", memory: 32Gi }
        limits: { memory: 40Gi }
      shmSize: 1Gi
      args:
        - --model=/models/qwen3.6-35b-a3b-gguf/Qwen3.6-35B-A3B-Q4_K_M.gguf
        - --alias=ggml-org/Qwen3.6-35B-A3B-GGUF
        - --host=0.0.0.0
        - --port=8000
        - --ctx-size=32768
        - --threads=16
        - --parallel=2
        - --jinja
        - --no-webui
        - --offline

# ─────────────── Network policy: default-deny, explicit allow-list ───────────────
networkPolicy:
  enabled: true
  ingress:
    # Peers allowed to reach the router (8080) / control plane (8081).
    # Empty list = any source (needed for most ingress controllers). Restrict in production.
    router: []
    controlPlane: []
    # - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: ingress-nginx } }
    # Extra peers allowed to call the model pools directly (the Caliban data plane always is).
    # Keep empty: clients should go through Caliban (PII, routing, cache salt, metering).
    modelPools: []
  egress:
    dns:
      enabled: true
      namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: kube-system } }
      podSelector: { matchLabels: { k8s-app: kube-dns } }
    # Datastores. Default: pods in the release namespace on their standard ports.
    datastores:
      - to: [{ podSelector: {} }]
        ports:
          - { port: 5432, protocol: TCP }   # postgres
          - { port: 6333, protocol: TCP }   # qdrant http
          - { port: 6379, protocol: TCP }   # valkey
    # Self-hosted model servers OUTSIDE this release (vLLM / SGLang / llm-d gateway in an `llm`
    # namespace). In-release modelPools are allowed automatically.
    localModels:
      - to: [{ namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: llm } } }]
        ports:
          - { port: 8000, protocol: TCP }
    # BYOK provider allow-list. Empty = no internet egress at all (air-gapped default).
    # `cidrs` render into the standard NetworkPolicy (ipBlock). `hosts` need an FQDN-aware
    # CNI: set networkPolicy.cilium.enabled=true to render a CiliumNetworkPolicy.
    providers: []
    # - name: openai
    #   cidrs: ["162.159.140.245/32"]     # example only; get current ranges from the provider
    #   hosts: ["api.openai.com"]
    #   ports: [443]
    # The single sign-on issuer (sso.enabled), for the control plane only: discovery, signing
    # keys and the token endpoint all live on the issuer's origin. Same shape as datastores.
    # Rendered only with sso.enabled. Empty = no rule (the control plane cannot reach it).
    identityProvider: []
    # - to: [{ namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: keycloak } } }]
    #   ports:
    #     - { port: 8443, protocol: TCP }
    # - to: [{ ipBlock: { cidr: 10.20.0.15/32 } }]   # an identity provider outside the cluster
    #   ports:
    #     - { port: 443, protocol: TCP }
    # Raw extra egress rules (NetworkPolicyEgressRule objects), e.g. an OTLP collector.
    extra: []
  cilium:
    enabled: false
